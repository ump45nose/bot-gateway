[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-gateway"
version = "0.1.0"
description = "Durable Telegram routing for multiple bots and applications"
requires-python = ">=3.11"
dependencies = ["requests==2.34.2"]

[project.scripts]
bot-gateway = "bot_gateway.main:main"

[tool.setuptools.packages.find]
include = ["bot_gateway*"]
